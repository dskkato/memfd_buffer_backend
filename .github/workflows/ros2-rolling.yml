name: ROS 2 Rolling CI

on:
  pull_request:
    branches:
      - rolling
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: rostooling/setup-ros-docker:ubuntu-resolute-ros-rolling-ros-base-latest

    steps:
      - name: Build and test ROS packages
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: |
            memfd_buffer_backend_msgs
            memfd_buffer
            memfd_buffer_backend_py
            memfd_buffer_backend
          target-ros2-distro: rolling
          no-symlink-install: true
          colcon-defaults: |
            {
              "build": {
                "cmake-args": [
                  "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
                ]
              }
            }
          coverage-result: false

  windows-build-and-test:
    runs-on: windows-2022

    steps:
      # setup-ros runs rosdep init internally. Python 3.12 removed distutils,
      # so install a setuptools release that provides the compatibility shim
      # before setup-ros starts.
      - name: Prepare Python packaging tools
        shell: pwsh
        run: |
          python -m pip install --upgrade "setuptools>=66.1,<82"
          $pythonCheck = @(
            "import sys"
            "import setuptools"
            "import distutils.version"
            "print(sys.version)"
            "print(setuptools.__version__)"
            "print(distutils.version.__file__)"
          ) -join "; "
          python -c $pythonCheck

      - name: Set up ROS 2
        uses: ros-tooling/setup-ros@0.7.18
        with:
          required-ros-distributions: rolling

      - name: Build and test ROS 2 packages
        uses: ros-tooling/action-ros-ci@0.4.8
        with:
          package-name: |
            memfd_buffer_backend_msgs
            memfd_buffer
            memfd_buffer_backend_py
            memfd_buffer_backend
          target-ros2-distro: rolling
          no-symlink-install: true
          coverage-result: false
