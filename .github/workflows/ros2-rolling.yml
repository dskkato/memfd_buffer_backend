name: ROS 2 Rolling CI

on:
  pull_request:
    branches:
      - rolling
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: rostooling/setup-ros-docker:ubuntu-resolute-ros-rolling-ros-base-latest

    steps:
      - name: Build and test ROS packages
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: |
            memfd_buffer_backend_msgs
            memfd_buffer
            memfd_buffer_backend_py
            memfd_buffer_backend
          target-ros2-distro: rolling
          no-symlink-install: true
          colcon-defaults: |
            {
              "build": {
                "cmake-args": [
                  "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
                ]
              }
            }
          coverage-result: false

  windows-build-and-test:
    runs-on: windows-2022

    steps:
      # setup-ros installs setuptools<60 and then runs rosdep. On Python 3.12,
      # force setuptools' vendored distutils shim for every Python subprocess.
      - name: Prepare Python compatibility
        shell: pwsh
        run: |
          $compatDir = Join-Path $env:RUNNER_TEMP "python-compat"
          New-Item -ItemType Directory -Path $compatDir -Force | Out-Null
          $sitecustomize = @(
            "import os"
            "os.environ['SETUPTOOLS_USE_DISTUTILS'] = 'local'"
            "import _distutils_hack"
            "_distutils_hack.do_override()"
          )
          $sitecustomizePath = Join-Path $compatDir "sitecustomize.py"
          $sitecustomize | Set-Content -Path $sitecustomizePath -Encoding utf8
          $pythonPath = $compatDir
          if ($env:PYTHONPATH) {
            $pythonPath = "$compatDir;$env:PYTHONPATH"
          }
          $env:PYTHONPATH = $pythonPath
          $githubEnvLine = "PYTHONPATH=$pythonPath"
          $githubEnvPath = $env:GITHUB_ENV
          $githubEnvLine | Out-File -FilePath $githubEnvPath `
            -Encoding utf8 -Append
          $pythonCheck = "import distutils.version; " + `
            "print(distutils.version.__file__)"
          python -c $pythonCheck

      - name: Set up ROS 2
        uses: ros-tooling/setup-ros@0.7.18
        with:
          required-ros-distributions: rolling

      - name: Build and test ROS 2 packages
        uses: ros-tooling/action-ros-ci@0.4.8
        with:
          package-name: |
            memfd_buffer_backend_msgs
            memfd_buffer
            memfd_buffer_backend_py
            memfd_buffer_backend
          target-ros2-distro: rolling
          no-symlink-install: true
          coverage-result: false
