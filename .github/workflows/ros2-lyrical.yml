name: ROS 2 Lyrical CI

on:
  pull_request:
    branches:
      - lyrical
      - rolling
  push:
    branches:
      - lyrical
      - rolling
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: rostooling/setup-ros-docker:ubuntu-resolute-ros-lyrical-ros-base-latest

    steps:
      - name: Build and test ROS packages
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: |
            memfd_buffer_backend_msgs
            memfd_buffer
            memfd_buffer_backend_py
            memfd_buffer_backend
          target-ros2-distro: lyrical
          no-symlink-install: true
          colcon-defaults: |
            {
              "build": {
                "cmake-args": [
                  "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
                ]
              }
            }
          coverage-result: false

  windows-build-and-test:
    runs-on: windows-2022

    steps:
      - name: Set up ROS build tools
        uses: ros-tooling/setup-ros@v0.7

      - name: Restore Python 3.12 packaging compatibility
        shell: pwsh
        run: python -m pip install --upgrade "setuptools==66.1.1"

      - name: Build ROS 2 Lyrical dependencies from source and test packages
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: |
            memfd_buffer_backend_msgs
            memfd_buffer
            memfd_buffer_backend_py
            memfd_buffer_backend
          target-ros2-distro: lyrical
          vcs-repo-file-url: https://raw.githubusercontent.com/ros2/ros2/lyrical/ros2.repos
          no-symlink-install: true
          colcon-defaults: |
            {
              "build": {
                "cmake-args": [
                  "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
                ]
              }
            }
          coverage-result: false
