name: ROS 2 Lyrical CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:resolute
    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Set up ROS 2 Lyrical
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: lyrical

      - name: Build and test ROS packages
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: |
            memfd_buffer_backend_msgs
            memfd_buffer
            memfd_buffer_backend
          target-ros2-distro: lyrical
          no-symlink-install: true
          extra-cmake-args: -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          coverage-result: false
